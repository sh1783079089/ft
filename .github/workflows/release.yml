name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (Windows / MinGW UCRT64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: gcc -std=c11 -O2 -s -o file_tracker.exe src/main.c src/tracker.c src/storage.c src/lib.c

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: file_tracker.exe
          generate_release_notes: true
